name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Build PicoClaw core for Android ARMv7
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/sipeed/picoclaw.git /tmp/picoclaw
          cd /tmp/picoclaw
          git checkout bbf6893ca7afad27f1d00a0f5a45982a549c6ed6
          go generate ./...
          mkdir -p "$GITHUB_WORKSPACE/picoclawapp/src/main/jniLibs/armeabi-v7a"
          CGO_ENABLED=0 GOOS=android GOARCH=arm GOARM=7 \
            go build -tags stdjson -trimpath \
            -o "$GITHUB_WORKSPACE/picoclawapp/src/main/jniLibs/armeabi-v7a/libpicoclaw.so" \
            ./cmd/picoclaw
          file "$GITHUB_WORKSPACE/picoclawapp/src/main/jniLibs/armeabi-v7a/libpicoclaw.so"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APKs
        run: gradle :app:assembleDebug :picoclawapp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Mini9Router-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PicoClaw-ARMv7-Android5-APK
          path: picoclawapp/build/outputs/apk/debug/picoclawapp-debug.apk
