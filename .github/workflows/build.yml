name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Build PicoClaw core for Android ARMv7
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/sipeed/picoclaw.git /tmp/picoclaw
          cd /tmp/picoclaw
          git checkout bbf6893ca7afad27f1d00a0f5a45982a549c6ed6
          go generate ./...

          mkdir -p "$GITHUB_WORKSPACE/picoclawapp/src/main/jniLibs/armeabi-v7a"

          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ]; then
            NDK=$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)
          fi
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TOOLCHAIN/armv7a-linux-androideabi21-clang"
          export CXX="$TOOLCHAIN/armv7a-linux-androideabi21-clang++"

          test -x "$CC"
          "$CC" --version

          CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 \
            go build -tags stdjson -trimpath -buildmode=pie \
            -ldflags='-s -w' \
            -o "$GITHUB_WORKSPACE/picoclawapp/src/main/jniLibs/armeabi-v7a/libpicoclaw.so" \
            ./cmd/picoclaw

          file "$GITHUB_WORKSPACE/picoclawapp/src/main/jniLibs/armeabi-v7a/libpicoclaw.so"
          readelf -h "$GITHUB_WORKSPACE/picoclawapp/src/main/jniLibs/armeabi-v7a/libpicoclaw.so" | head -30

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APKs
        run: gradle :app:assembleDebug :picoclawapp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Mini9Router-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PicoClaw-ARMv7-Android5-APK
          path: picoclawapp/build/outputs/apk/debug/picoclawapp-debug.apk
